name: Rappels

on:
  schedule:
    - cron: '7 * * * *'   # chaque heure ; le script n'envoie qu'aux heures choisies dans l'app
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer un rappel maintenant (test)"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Envoyer les rappels
        working-directory: push
        env:
          HABITUDES_GIST: ${{ secrets.HABITUDES_GIST }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: |
          npm ci --no-audit --no-fund --silent
          node send.mjs
      # GitHub met en pause les tâches planifiées après 60 jours sans activité :
      # une fois par jour, on les réactive (sans effet si elles sont déjà actives)
      - name: Garder les rappels actifs
        if: github.event_name == 'schedule' && startsWith(github.event.schedule, '7 ')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/reminders.yml/enable" && echo "Rappels gardés actifs"
          fi
